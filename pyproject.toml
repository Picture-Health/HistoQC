[build-system]
requires = [
  "setuptools >= 42",
  "wheel",
  "setuptools_scm[toml]>=3.4",
]
build-backend = "setuptools.build_meta"

[tool.setuptools_scm]
write_to = "histoqc/_version.py"
version_scheme = "post-release"

[tool.pytest.ini_options]
# The golden test is opt-in: `pytest -m integration tests/golden` (a later -m
# replaces this one) with GOLDEN_FIXTURES_DIR or GOLDEN_FIXTURES_S3=1 set.
addopts = "-v -m 'not integration'"
markers = [
  "integration: opt-in golden test; skips with no fixture source, fails on any fixture error",
]

[tool.coverage.run]
source = ["histoqc"]

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "raise NotImplementedError",
  "if TYPE_CHECKING:",
  "if MYPY:",
  "except ImportError:",
]
