#
# Conda devenv environment for histoqc
#
# To create the environment and don't install `histoqc` in development mode:
#   ```
#   > conda devenv
#   # equivalent to:
#   > HISTOQC_DEVEL="" conda devenv
#   ```
#
# To create the environment and install `histoqc` in development mode:
#   ```
#   > HISTOQC_DEVEL=TRUE conda devenv
#   ```
#

{% set HISTOQC_DEVEL = os.environ.get('HISTOQC_DEVEL', False) %}

name: histoqc

channels:
  - sdvillal  # newer/better versions of everything that matters
  - conda-forge

dependencies:
  - python >=3.8
  - pip
  - numpy
  - scipy
  - matplotlib
  - scikit-image
  - scikit-learn
  - matplotlib
  - typing-extensions
  - shapely
  - lazy-property
  - setuptools-scm
  - wheel

  - pip:
    # OpenSlide-compatible reader on tifffile (no LGPL OpenSlide); private repo, so installs need GitHub access. Pinned to the commit under review; switch to the release tag after pathology-slide-reader PR #1 merges.
    - "pathology-slide-reader @ git+https://github.com/Picture-Health/pathology-slide-reader@67bb94b8d617d3134c9d228fd835fcc75ea6e5eb"
    - "-e ."  # [ HISTOQC_DEVEL ]
